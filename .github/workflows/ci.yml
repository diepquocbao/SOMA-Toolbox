# CI for the SOMA Toolbox.
# Runs the unittest suite on the oldest supported MATLAB release (R2021a,
# the MinimumMatlabRelease declared in packageToolbox.m) and on the latest
# release. MathWorks provides free MATLAB licensing for public GitHub
# repositories via matlab-actions/setup-matlab.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: MATLAB ${{ matrix.release }}
    # MathWorks licenses MATLAB on GitHub-hosted runners for PUBLIC repos only;
    # skip while the repository is private (activates automatically on publish).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [R2021a, latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}

      - name: Run test suite
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: toolbox
          select-by-folder: tests
          test-results-junit: test-results/results-${{ matrix.release }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.release }}
          path: test-results
